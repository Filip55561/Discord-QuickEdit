name: Build and Upload Artifact

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet publish --configuration Debug -r win-x64 -o ./publish/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Discord-QuickEdit
        path: './publish/**'
